server {
    listen 80;
    root /usr/share/nginx/html;
    charset utf-8;
    autoindex off;

    # Only two kinds of files live here.
    types {
        application/epub+zip epub;
        application/atom+xml xml;
    }

    location = /opds.xml {
        # Empty types map so default_type (with the OPDS profile) applies.
        types { }
        default_type "application/atom+xml;profile=opds-catalog;charset=utf-8";
        add_header Cache-Control "no-cache";
    }

    location /publications/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
